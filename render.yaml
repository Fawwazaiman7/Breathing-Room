# Render Blueprint for the Breathing Room backend.
# In Render: New > Blueprint, pick this repository, then fill in the
# values Render asks for (the ones marked sync: false).
services:
  - type: web
    name: breathing-room-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CHAT_MIN_SIMILARITY
        value: "0.60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
